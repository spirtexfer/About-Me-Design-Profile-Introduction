name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT "pages": that is the group GitHub's own pages-build-deployment workflow
  # uses, so sharing it means queuing behind runs this repo does not control.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two jobs, not two steps, and the split is load-bearing. Uploading and
# deploying back-to-back in one job put ~400ms between the artifact being
# finalised and deploy-pages asking the API for it, which is inside the
# artifact API's eventual-consistency window — the deploy then failed with
# "No artifacts named github-pages were found". A job boundary tears down the
# runner and starts a new one, which is many seconds, so the lookup is never
# racing. It also makes a re-run safe: "re-run failed jobs" repeats only
# `deploy`, reusing the artifact, instead of uploading a second copy and
# failing with "Multiple artifacts named github-pages".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 20
