name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT "pages": GitHub's own pages-build-deployment workflow uses that name, and
  # two of its runs are permanently stuck queued, holding the lock. Sharing the
  # group means every run here waits behind runs that will never finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages publish service takes ~10 min for this site, and the
          # action defaults to a 10 min ceiling, so deploys were a coin flip.
          timeout: 1800000
          error_count: 20
